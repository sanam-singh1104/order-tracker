# Deliver Order Tracker alerts to the incident responder (incident-response/).
# The notification policy replaces Grafana's default one, so every alert in
# this stack goes to the responder.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          url: http://incident-responder:8001/alerts
          httpMethod: POST
        # The responder only acts on firing alerts.
        disableResolveMessage: true

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [grafana_folder, alertname, http_route]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
