# Metrics arrive via the OTLP receiver (--web.enable-otlp-receiver),
# pushed by the OpenTelemetry Collector.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Keep service.name as a queryable label in addition to `job`.
  promote_resource_attributes:
    - service.name

storage:
  tsdb:
    # Pushed OTLP samples can arrive slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
